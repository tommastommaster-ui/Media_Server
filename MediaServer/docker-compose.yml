
services:
  postgres:
    image: postgres:16
    container_name: postgresSQL
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - mrp-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    image: adminer
    container_name: mrp-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  mrp-data: